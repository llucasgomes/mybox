<ion-content [fullscreen]="true" class="supervisor-content">
  <div class="safe-area-top supervisor-page min-h-screen text-slate-100">
    <app-header></app-header>
    <main class="mx-auto w-full max-w-7xl space-y-6 px-4 py-6 sm:px-8">
      @if (alarm(); as currentAlarm) {
      <div
        class="flex items-center gap-3 rounded-2xl border p-4 text-sm shadow-lg"
        [class]="currentAlarm.className"
        role="status"
      >
        <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          />
        </svg>
        <p><strong>Atenção:</strong> {{ currentAlarm.message }}</p>
      </div>
      }

      <div class="grid grid-cols-1 gap-6 lg:grid-cols-12">
        <app-tank-visualization
          class="lg:col-span-7"
          [model]="selectedModel()"
          [capacity]="tankCapacity()"
          [level]="waterLevelPct()"
          [pumpMode]="pumpMode()"
          [canControl]="deviceStatus() !== null"
          [pumpBusy]="savingPump() || loadingStatus()"
          [showAnnotations]="showAnnotations()"
          (annotationsToggle)="toggleAnnotations()"
          (pumpAction)="handlePumpAction($event)"
        />
      </div>

      <!-- <app-tank-catalog
        [specs]="filteredSpecs()"
        [selectedModel]="selectedModel()"
        [searchQuery]="searchQuery()"
        (modelSelected)="selectModel($event)"
        (searchChanged)="searchQuery.set($event)"
      /> -->
    </main>

    <footer class="border-t border-slate-900 bg-slate-950/80 px-4 py-4 text-center font-mono text-xs text-slate-500">
      Supervisão do reservatório • Dados e comandos conectados ao dispositivo.
    </footer>
  </div>
</ion-content>
