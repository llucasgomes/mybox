<header class="sticky top-0 z-10 border-b border-slate-800/80 bg-slate-950/90 px-4 py-4 backdrop-blur-md sm:px-8">
  <div class="mx-auto flex max-w-7xl flex-col justify-between gap-4 sm:flex-row sm:items-center">
    <div class="flex items-center gap-3">
      <div
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-cyan-500/15 text-cyan-300 ring-1 ring-cyan-400/30"
      >
        <svg
          class="h-6 w-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19.4 15.4a2 2 0 0 0-1-.5l-2.4-.5a6 6 0 0 0-3.9.5l-.3.2a6 6 0 0 1-3.9.5l-1.9-.4a2 2 0 0 0-1.8.5M8 4h8l-1 1v5.2a2 2 0 0 0 .6 1.4l5 5c1.3 1.3.4 3.4-1.4 3.4H4.8c-1.8 0-2.7-2.1-1.4-3.4l5-5A2 2 0 0 0 9 10.2V5L8 4Z"
          />
        </svg>
      </div>
      <div>
        <div class="flex flex-wrap items-center gap-2">
          <h1 class="text-base font-bold tracking-tight text-white sm:text-lg">Supervisório de Reservatório</h1>
        </div>
        <p class="mt-1 text-xs text-slate-400">Modelagem técnica paramétrica • Catálogo de caixas d'água</p>
      </div>
      <button
        type="button"
        z-button
        zType="outline"
        zSize="icon"
        aria-label="Abrir menu de navegação"
        (click)="visible.set(true)"
        class="ml-auto flex h-11 w-11 shrink-0 items-center justify-center border-cyan-400/30 bg-cyan-500/10 text-cyan-300 hover:bg-cyan-500/20"
      >
        <ng-icon name="lucideMenu" size="20" />
      </button>
      <z-sheet
        [(zVisible)]="visible"
        zSide="left"
        zWidth="18rem"
        class="!border-slate-800 !bg-[#070b14] !text-slate-100"
      >
        <z-sheet-header class="border-b border-slate-800 pb-5">
          <z-sheet-title class="text-lg font-semibold text-white">Menu</z-sheet-title>
          <z-sheet-description class="text-slate-400">Navegue pelas páginas do supervisório.</z-sheet-description>
        </z-sheet-header>
        <nav class="flex flex-col gap-2 px-4" aria-label="Rotas principais">
          <a
            routerLink="/home"
            z-button
            zType="ghost"
            z-sheet-close
            class="justify-start gap-3 text-slate-200 hover:bg-slate-800 hover:text-white"
          >
            <ng-icon name="lucideHome" size="18" aria-hidden="true" />
            Início
          </a>
          <a
            routerLink="/config"
            z-button
            zType="ghost"
            z-sheet-close
            class="justify-start gap-3 text-slate-200 hover:bg-slate-800 hover:text-white"
          >
            <ng-icon name="lucideSettings" size="18" aria-hidden="true" />
            Configurações
          </a>
        </nav>
      </z-sheet>
    </div>
  </div>
</header>
